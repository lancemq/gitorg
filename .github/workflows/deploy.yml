name: Deploy to Tencent Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 106.54.23.93 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync source to server
        run: |
          rsync -az --delete \
            --exclude node_modules --exclude .next --exclude .git \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ ubuntu@106.54.23.93:apps/gitorg/

      - name: Build and restart on server
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ubuntu@106.54.23.93 "
            set -e
            cd ~/apps/gitorg
            if ! diff -q package-lock.json ~/apps/.last-lock >/dev/null 2>&1; then
              echo '[deps] installing'
              npm ci --no-audit --no-fund
              cp package-lock.json ~/apps/.last-lock
            fi
            echo '[build] starting'
            NEXT_PUBLIC_SITE_URL=https://git.aiqo.top npm run build
            sudo systemctl restart gitorg
            sleep 4
            CODE=\$(curl -s -o /dev/null -w '%{http_code}' -m 15 http://127.0.0.1:3000/zh)
            echo "[health] /zh -> \$CODE"
            [ "\$CODE" = '200' ] || exit 1
          "

      - name: Verify public site
        run: |
          sleep 3
          # IP + Host 头方式验证（避开域名备案 SNI 拦截）
          CODE=$(curl -sk -o /dev/null -w '%{http_code}' -m 15 -H "Host: git.aiqo.top" https://106.54.23.93/zh)
          echo "https://106.54.23.93/zh (Host: gitorg.xyz) -> $CODE"
          [ "$CODE" = "200" ] || exit 1
